"><tspan x="1816.8152404630578" dy="0">NO</tspan></text><path d="M 1827.190476190476 2803.6522321428574 L 1783.1904761904757 2803.6522321428574 L 1783.1904761904757 2753.6522321428574 L 1739.1904761904757 2753.6522321428574" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/><rect x="1466.5238095238092" y="2983.752232142857" width="266.66666666666663" height="260" rx="12" fill="transparent" stroke="#1e1e1e" stroke-width="2"/><path d="M 1599.7571428571425 2889.7522321428564 L 1599.7571428571425 2977.7522321428573" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/><rect x="1833.1904761904757" y="3083.752232142857" width="266.66666666666663" height="260" rx="12" fill="transparent" stroke="#1e1e1e" stroke-width="2"/><path d="M 1739.1904761904757 3113.6522321428574 L 1783.1904761904757 3113.6522321428574 L 1783.1904761904757 3213.652232142857 L 1827.190476190476 3213.652232142857" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/><rect x="733.1904761904761" y="178.9903273809524" width="266.66666666666663" height="135" rx="12" fill="transparent" stroke="#1e1e1e" stroke-width="2"/><path d="M 639.1904761904761 226.98556547619054 L 683.1904761904761 226.98556547619054 L 683.1904761904761 246.349980846299 L 727.1904761904763 246.349980846299" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/><path d="M 866.4238095238095 319.9903273809524 L 866.4238095238095 423.1760416666667 L 639.1904761904761 423.1760416666667" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/><rect x="1099.8571428571427" y="1173.7522321428569" width="266.66666666666663" height="260" rx="12" fill="transparent" stroke="#1e1e1e" stroke-width="2"/><path d="M 1005.8571428571427 1278.6522321428572 L 1049.8571428571427 1278.6522321428572 L 1049.8571428571427 1303.6284226190471 L 1093.857142857143 1303.6284226190471" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/><text x="499.85714285714283" y="38.39508928571431" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="499.85714285714283" dy="0">Peticion del Usuario</tspan></text><text x="499.85714285714283" y="234.5855654761905" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="499.85714285714283" dy="0">SDD Preflight/sdd-init</tspan></text><text x="499.85714285714283" y="418.2760416666667" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="499.85714285714283" dy="0">SDD Product Quest </tspan><tspan x="499.85714285714283" dy="25.0">(budget of 50 quests) </tspan></text><text x="499.85714285714283" y="614.4665178571429" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="499.85714285714283" dy="0">SDD Architecture Quest</tspan><tspan x="499.85714285714283" dy="25.0">(budget of 20 quests)</tspan></text><text x="866.5238095238094" y="626.9665178571429" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="866.5238095238094" dy="0">SDD Research</tspan></text><text x="499.85714285714283" y="823.156994047619" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="499.85714285714283" dy="0">SDD Explore </tspan></text><text x="866.5238095238094" y="798.156994047619" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="866.5238095238094" dy="0">SDD Proposal</tspan><tspan x="866.5238095238094" dy="25.0">(with the product rfc &amp;</tspan><tspan x="866.5238095238094" dy="25.0">sdd-explore/sdd-research)</tspan></text><text x="866.5238095238094" y="988.7522321428571" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="866.5238095238094" dy="0">SDD Spec</tspan><tspan x="866.5238095238094" dy="25.0">(with the porposal &amp;</tspan><tspan x="866.5238095238094" dy="25.0">architecture rfc &amp; </tspan><tspan x="866.5238095238094" dy="25.0">sdd-explore/sdd-research)</tspan></text><text x="866.5238095238094" y="1198.752232142857" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="866.5238095238094" dy="0">SDD Architecture Plan</tspan><tspan x="866.5238095238094" dy="25.0">(utiliza principios de</tspan><tspan x="866.5238095238094" dy="25.0">arquitecturas y patrones</tspan><tspan x="866.5238095238094" dy="25.0">de diseño para la solucion</tspan><tspan x="866.5238095238094" dy="25.0">propuesta, recibe el</tspan><tspan x="866.5238095238094" dy="25.0">`architecture rfc` +</tspan><tspan x="866.5238095238094" dy="25.0">`sdd-explore/sdd-</tspan><tspan x="866.5238095238094" dy="25.0">research` + sdd-spec)</tspan></text><text x="866.5238095238094" y="1508.7522321428569" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="866.5238095238094" dy="0">(Automatic/Interactive)</tspan><tspan x="866.5238095238094" dy="25.0">Aprovacion del usuario de</tspan><tspan x="866.5238095238094" dy="25.0">la arquitectura</tspan><tspan x="866.5238095238094" dy="25.0">presentada</tspan></text><text x="110.1904761904762" y="405.9665178571429" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="110.1904761904762" dy="0">El usuario tiene que</tspan><tspan x="110.1904761904762" dy="25.0">aprovar explicitamente el</tspan><tspan x="110.1904761904762" dy="25.0">RFC resultante.</tspan></text><text x="111.84912324694011" y="602.5758928571429" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="111.84912324694011" dy="0">El usuario tiene que</tspan><tspan x="111.84912324694011" dy="25.0">aprovar explicitamente el</tspan><tspan x="111.84912324694011" dy="25.0">RFC resultante.</tspan></text><text x="111.84912324694011" y="793.171130952381" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="111.84912324694011" dy="0">SDD RFC Author </tspan><tspan x="111.84912324694011" dy="25.0">Sub-Agent escribe los dos</tspan><tspan x="111.84912324694011" dy="25.0">rfc artifacts </tspan><tspan x="111.84912324694011" dy="25.0">(product-rfc.md &amp; arch-</tspan><tspan x="111.84912324694011" dy="25.0">rfc.md)</tspan></text><text x="1233.190476190476" y="1508.7522321428569" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1233.190476190476" dy="0">SDD Desing con:</tspan><tspan x="1233.190476190476" dy="25.0">product-rfc, arch-rfc,</tspan><tspan x="1233.190476190476" dy="25.0">sdd-spec, acta del</tspan><tspan x="1233.190476190476" dy="25.0">architecture plan.</tspan></text><text x="1597.960646066015" y="1284.5356749672717" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1597.960646066015" dy="0">SDD Tasks (TDD)</tspan></text><text x="1599.8571428571424" y="1541.6025530301138" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1599.8571428571424" dy="0">SDD Apply</tspan><tspan x="1599.8571428571424" dy="25.0">Lanzar un sdd-apply para</tspan><tspan x="1599.8571428571424" dy="25.0">cada 5 tasks, es decir, </tspan><tspan x="1599.8571428571424" dy="25.0">si hay 20 Batchs de</tspan><tspan x="1599.8571428571424" dy="25.0">tasks, lanzar 4 sdd-apply</tspan><tspan x="1599.8571428571424" dy="25.0">no en </tspan><tspan x="1599.8571428571424" dy="25.0">paralelos para evitar</tspan><tspan x="1599.8571428571424" dy="25.0">conflictos.</tspan></text><text x="1599.8571428571424" y="1928.7522321428569" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1599.8571428571424" dy="0">SDD Architecture Lint</tspan><tspan x="1599.8571428571424" dy="25.0">(verifica que la solucion</tspan><tspan x="1599.8571428571424" dy="25.0">de sdd-apply cumpla con lo</tspan><tspan x="1599.8571428571424" dy="25.0">pactado en sdd-design,</tspan><tspan x="1599.8571428571424" dy="25.0">sdd-architecture-plan y en</tspan><tspan x="1599.8571428571424" dy="25.0">el `arch rfc`). Si falla, se</tspan><tspan x="1599.8571428571424" dy="25.0">vuelve al SDD-Design con</tspan><tspan x="1599.8571428571424" dy="25.0">los fallos y gaps</tspan><tspan x="1599.8571428571424" dy="25.0">encontrados (max 2</tspan><tspan x="1599.8571428571424" dy="25.0">loops).</tspan></text><text x="1599.8571428571424" y="2351.252232142857" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1599.8571428571424" dy="0">SDD Verify corre los</tspan><tspan x="1599.8571428571424" dy="25.0">tests para comprobar que</tspan><tspan x="1599.8571428571424" dy="25.0">todos esten verdes y</tspan><tspan x="1599.8571428571424" dy="25.0">verifica que todo vaya de</tspan><tspan x="1599.8571428571424" dy="25.0">la forma esperada.</tspan></text><text x="1966.523809523809" y="2363.752232142857" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1966.523809523809" dy="0">SDD Hard Verify Opcional:</tspan><tspan x="1966.523809523809" dy="25.0">Preguntar al usuario si</tspan><tspan x="1966.523809523809" dy="25.0">quiere realizar un Hard</tspan><tspan x="1966.523809523809" dy="25.0">Verify.</tspan></text><text x="1966.523809523809" y="2648.752232142857" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1966.523809523809" dy="0">Buscar en el codigo</tspan><tspan x="1966.523809523809" dy="25.0">generado gaps,</tspan><tspan x="1966.523809523809" dy="25.0">validaciones, o codigo</tspan><tspan x="1966.523809523809" dy="25.0">sensible entre</tspan><tspan x="1966.523809523809" dy="25.0">modificaciones y realizar</tspan><tspan x="1966.523809523809" dy="25.0">cambios que romperian la</tspan><tspan x="1966.523809523809" dy="25.0">aplicacion para que los</tspan><tspan x="1966.523809523809" dy="25.0">tests fallen, si los tests</tspan><tspan x="1966.523809523809" dy="25.0">no fallan o los mensajes</tspan><tspan x="1966.523809523809" dy="25.0">no son claros, es un error</tspan><tspan x="1966.523809523809" dy="25.0">de testing, hay que</tspan><tspan x="1966.523809523809" dy="25.0">relanzar SDD Tasks con</tspan><tspan x="1966.523809523809" dy="25.0">el acta completa de lo que</tspan><tspan x="1966.523809523809" dy="25.0">hay que cambiar/mejorar.</tspan></text><text x="1599.8571428571424" y="2661.252232142857" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1599.8571428571424" dy="0">SDD Changelog para</tspan><tspan x="1599.8571428571424" dy="25.0">generar un archivo que</tspan><tspan x="1599.8571428571424" dy="25.0">documente todos los</tspan><tspan x="1599.8571428571424" dy="25.0">cambios para cuando se</tspan><tspan x="1599.8571428571424" dy="25.0">haga la proxima release, si</tspan><tspan x="1599.8571428571424" dy="25.0">ya existe uno y no fue</tspan><tspan x="1599.8571428571424" dy="25.0">usado en la ultima release,</tspan><tspan x="1599.8571428571424" dy="25.0">no se sobreescribe, se</tspan><tspan x="1599.8571428571424" dy="25.0">agregan los changelogs.</tspan></text><text x="1599.8571428571424" y="3008.752232142857" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1599.8571428571424" dy="0">SDD Pre-Experience:</tspan><tspan x="1599.8571428571424" dy="25.0">Guarda informacion</tspan><tspan x="1599.8571428571424" dy="25.0">(Engram/Openspec/Both)</tspan><tspan x="1599.8571428571424" dy="25.0">de todos los fallos que se</tspan><tspan x="1599.8571428571424" dy="25.0">han ido encontrando</tspan><tspan x="1599.8571428571424" dy="25.0">durante la sesion del SDD</tspan><tspan x="1599.8571428571424" dy="25.0">y si hay algo que se</tspan><tspan x="1599.8571428571424" dy="25.0">podria convertir en una</tspan><tspan x="1599.8571428571424" dy="25.0">skill proponerle al usuario</tspan><tspan x="1599.8571428571424" dy="25.0">crearla.</tspan></text><text x="1966.523809523809" y="3221.252232142857" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1966.523809523809" dy="0">SDD Archive</tspan></text><text x="866.5238095238094" y="203.9903273809524" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="866.5238095238094" dy="0">SDD Worktrees + PR</tspan><tspan x="866.5238095238094" dy="25.0">setup</tspan><tspan x="866.5238095238094" dy="25.0">(crea un wokrtree en</tspan><tspan x="866.5238095238094" dy="25.0">~/.agents_worktrees y un</tspan><tspan x="866.5238095238094" dy="25.0">pr para este cambio)</tspan></text><text x="1233.190476190476" y="1198.7522321428569" text-anchor="middle" font-size="20" font-family="'Comic Sans MS','Segoe Print',cursive" fill="#1e1e1e"><tspan x="1233.190476190476" dy="0">Si es necesario: Lanza un</tspan><tspan x="1233.190476190476" dy="25.0">SDD-Research para esta</tspan><tspan x="1233.190476190476" dy="25.0">fase en busca de</tspan><tspan x="1233.190476190476" dy="25.0">patrones de diseño y</tspan><tspan x="1233.190476190476" dy="25.0">arquitecturas que</tspan><tspan x="1233.190476190476" dy="25.0">solucionen los problemas</tspan><tspan x="1233.190476190476" dy="25.0">que tiene. El resultado del</tspan><tspan x="1233.190476190476" dy="25.0">sdd-research se pasa al</tspan><tspan x="1233.190476190476" dy="25.0">sub-agente </tspan><tspan x="1233.190476190476" dy="25.0">sdd-architecture-plan.</tspan></text></svg>
